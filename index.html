    <!-- Early error silencer for benign sandbox websocket connection notices -->
    <script>
      (function() {
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && (e.reason || e);
          var str = String(reason && (reason.message || reason) || '');
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('error', function(e) {
          var msg = String((e && (e.message || (e.error && e.error.message))) || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
